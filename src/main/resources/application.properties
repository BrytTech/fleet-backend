spring.application.name=backend

# PostgreSQL Datasource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.pool-name=FleetPool

# Defer database initialization - only run after all beans are initialized
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.web.resources.static-locations=file:uploads/,classpath:/static/,classpath:/public/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0

app.base-url=http://localhost:8080
qr.image.directory=uploads/qr-codes/



